name: Monthly Data Update

on:
  schedule:
    # 毎月1日を UTC 側で固定（末日可変を回避）。GitHub schedule は混雑時 3-6h 遅延するため
    # 早朝着に前倒しし、:00/:30 を避けて不人気分を採用。実行は実質「JST 2日早朝」。
    - cron: "9 20 1 * *"    # UTC 1日 20:09 = JST 2日 05:09  ← 主
    - cron: "29 21 1 * *"   # UTC 1日 21:29 = JST 2日 06:29  ← 予備（主の失火/遅延の保険）
  workflow_dispatch:
    inputs:
      force:
        description: "当月分が既に更新済みでも強制実行する (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  id-token: write   # claude-code-action が OIDC トークン取得に必要（欠けると認証前に失敗）
  issues: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    name: Re-research and update data.js
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 検証(g) の `git show HEAD:data.js` 比較に履歴が要る

      - name: Compute date (JST)
        id: date
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "value=$DATE" >> "$GITHUB_OUTPUT"
          echo "Target date (JST): $DATE"

      - name: Idempotency guard
        id: guard
        run: |
          # 多重 cron / retry で同月に複数回起動しても、最初の 1 回だけが更新する。
          # data.js の last_updated（最初に現れる YYYY-MM-DD）が当月なら skip。
          # workflow_dispatch の force=true は常に実行。
          DONE="false"
          LU=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CURYM=$(TZ=Asia/Tokyo date +%Y-%m)
            LU=$(grep -oE '"[0-9]{4}-[0-9]{2}-[0-9]{2}"' data.js | head -1 | tr -d '"')
            case "$LU" in
              "${CURYM}"*) DONE="true" ;;
            esac
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then DONE="false"; fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"
          echo "guard: done=$DONE (event=${{ github.event_name }}, last_updated=$LU)"

      - name: Re-research and rewrite data.js via Claude Code
        if: steps.guard.outputs.done != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは「AI/データサイエンス転職ナビ」のデータ更新担当として動作し、**実際に data.js を Write/Edit で書き換える**必要があります。計画・要約だけで終わらせず、必ずファイルを更新してください。

            ## 手順
            1. リポジトリ直下の `UPDATE.md`（データ更新ランブック）を Read し、その手順に忠実に従う。
            2. UPDATE.md の手順に沿って WebSearch で最新の年収相場を再調査する（対象年は **${{ steps.date.outputs.value }}** から導出。可能なら一次ソース＝厚労省 job tag / Morgan McKinley / 実求人の提示レンジを WebFetch する）。
            3. `data.js`（window.SALARY_DATA）の **数値・出典・体裁だけ** を最新化する：
               - benchmarks[].avg / note、ageBands[].lo / hi、companies[].range、sources{}.date / url、hotSkills.list
               - 新しい出典を足すときは sources に追加し、正しい tier（official / survey / posting / agency / tool）を付ける
            4. すべての実在値に出典（srcId）を付け、その srcId は sources に実在させる。出典のない数字を入れない。転職メディアの集計・解説記事は必ず tier:"agency"。
            5. `meta.last_updated` を **${{ steps.date.outputs.value }}**（JST 当日）に更新する。← 忘れると検証ゲートで弾かれます。

            ## 厳守事項（構造を壊さない・これが自動更新を継続させる鍵）
            - **`model{}` の計算ロジック（roleMul / skillPrem / premCap / expCurve）は変更しない。** 市場トレンドが大きく動いた確証があるときのみ UPDATE.md の指示に従い groundingNote に根拠を書いて微調整する（前回比 ±30% を超える変更は検証で reject されます）。
            - **その時点の data.js に存在するキー集合・セクション構成を変えない**（追加・削除・改名しない）。特定のキー名を前提にせず、現状の構造をそのまま尊重して値だけ最新化する（index.html が data.js のキーに依存して UI を生成しているため）。
            - **git コマンドは一切実行しない。書き込んでよいのは data.js のみ**（index.html / UPDATE.md などには触れない）。

            ## 仕上げ（必須）
            書き換え後、Bash で `node scripts/validate-data.mjs --expect-date ${{ steps.date.outputs.value }} --html index.html` を実行し、表示された ERROR をすべて解消してから終了する（model を閾値超で動かして無理に通すのは禁止）。
          claude_args: |
            --max-turns 60
            --model claude-opus-4-8
            --permission-mode bypassPermissions
            --allowed-tools Read,Write,Edit,Glob,Grep,Bash,WebFetch,WebSearch

      - name: Validate data.js (push gate)
        id: validate
        if: steps.guard.outputs.done != 'true'
        continue-on-error: true
        run: |
          # 検証 ERROR があれば exit 1 になるが、continue-on-error でジョブは続行し、
          # 結果を outputs.passed に伝搬して後続の push / issue を分岐させる。
          set +e
          node scripts/validate-data.mjs --strict --expect-date "${{ steps.date.outputs.value }}" --html index.html | tee validate_report.txt
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          echo "validate exit code: $CODE"

      - name: Commit and push (only if validation passed)
        if: steps.guard.outputs.done != 'true' && steps.validate.outputs.passed == 'true'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "ai-career-navigator-bot"
          git config user.email "ai-career-navigator-bot@users.noreply.github.com"
          # claude-code-action が origin のトークンを自分のものに上書きするため戻す
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -z "$(git status --porcelain data.js)" ]; then
            echo "No data.js changes; nothing to commit."
            exit 0
          fi
          git add data.js
          git commit -m "monthly data update: ${{ steps.date.outputs.value }}"
          git push origin HEAD:main
          echo "Pushed. GitHub Pages will redeploy automatically."

      - name: Open issue on validation failure (no push)
        if: steps.guard.outputs.done != 'true' && steps.validate.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          DATE: ${{ steps.date.outputs.value }}
        run: |
          YM=$(echo "$DATE" | cut -c1-7)
          # 同月の既存 issue があれば重複起票しない
          EXISTING=$(gh issue list --state open --search "月次更新 ${YM} in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "issue already exists for ${YM}; skip."
            exit 0
          fi
          {
            echo "月次自動更新で再調査後の data.js が検証ゲートで不合格になり、**push を中止**しました。"
            echo "壊れたデータは公開されていません（前回の data.js が引き続き表示されています）。"
            echo ""
            echo "## 検証エラー"
            echo '```'
            cat validate_report.txt 2>/dev/null || echo "(レポートなし)"
            echo '```'
            echo ""
            echo "## 変更差分（push されなかった内容・先頭 300 行）"
            echo '```diff'
            git diff -- data.js | head -300
            echo '```'
            echo ""
            echo "## 復旧の目安"
            echo "- 鮮度エラー（last_updated 未更新）→ Actions から force=true で再実行"
            echo "- 参照切れ / 域外 → ログ確認後、手元で node scripts/validate-data.mjs --html index.html"
            echo "- model 乖離 → roleMul / skillPrem が想定外に動いた。差分を人手で確認"
          } > issue_body.md
          gh issue create \
            --title "⚠️ AI転職ナビ 月次更新 ${DATE}: 検証失敗（push 中止）" \
            --body-file issue_body.md \
            --assignee "$OWNER" || true

      - name: Summary
        if: always()
        run: |
          echo "::notice title=公開URL::https://pandas-mizugorou.github.io/ai-career-navigator/"
          echo "guard.done=${{ steps.guard.outputs.done }} / validate.passed=${{ steps.validate.outputs.passed }}"
